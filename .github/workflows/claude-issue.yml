# Entwicklung über Issues: Issue schreiben, Claude setzt um, PR kommt zurück.
#
# Gedacht für die Bedienung vom Telefon. Der ganze Ablauf steht in
# docs/AUTOMATION.md.
#
# ╭─────────────────────────────────────────────────────────────────────╮
# │ ZWEI SCHLÖSSER, BEIDE MÜSSEN AUFGEHEN                               │
# │                                                                     │
# │ 1. Der Kommentar kommt vom Repo-Inhaber (die `if`-Bedingung unten)  │
# │ 2. Er enthält @claude (das Auslösewort der Action)                  │
# │                                                                     │
# │ Dazu kommt die Voreinstellung der Action selbst: Sie verlangt       │
# │ Schreibrecht am Repository. `allowed_non_write_users` wird hier      │
# │ NICHT gesetzt — in einem öffentlichen Repo könnte sonst jeder       │
# │ Fremde Claude mit selbst geschriebenem Auftrag starten, auf Kosten  │
# │ des Abos des Inhabers.                                              │
# ╰─────────────────────────────────────────────────────────────────────╯
name: claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude:
    # `github.event.comment.body` ist bei einem neu geöffneten Issue leer;
    # dann greift `github.event.issue.body`.
    #
    # ACHTUNG bei einem Repository unter einer ORGANISATION: Dort ist
    # `github.repository_owner` der Name der Organisation, `sender.login`
    # aber der einer Person — die Bedingung ginge nie auf. Dann hier den
    # eigenen Benutzernamen eintragen, etwa:
    #   github.event.sender.login == 'deinname' &&
    if: >-
      github.event.sender.login == github.repository_owner &&
      contains(github.event.comment.body || github.event.issue.body, '@claude')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Die Action braucht das auch mit eigenem Token.
      id-token: write
    # Das Kit selbst hat keinen Token — der gehört in das abgeleitete
    # Projekt, nicht in ein Template. Ohne ihn sagt der Lauf, was fehlt,
    # statt die halbe Werkzeugkette für nichts zu installieren.
    env:
      TOKEN_DA: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Ohne Token übersprungen
        if: env.TOKEN_DA != 'true'
        run: |
          echo "::notice title=Claude übersprungen::Kein CLAUDE_CODE_OAUTH_TOKEN hinterlegt. Einrichtung: docs/AUTOMATION.md"

      # Ein Leerzeichen oder Zeilenumbruch im Secret — beim Einfügen leicht
      # passiert und im Eingabefeld unsichtbar — lässt den Dienst mit 401
      # ablehnen. Die Action macht daraus ein nichtssagendes
      # `is_error:true` nach zwei Sekunden, ohne Grund zu nennen. Lieber
      # hier eine Zeile Klartext als eine halbe Stunde Suche.
      - name: Token auf Leerzeichen prüfen
        if: env.TOKEN_DA == 'true'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$TOKEN" != "$(printf '%s' "$TOKEN" | tr -d '[:space:]')" ]; then
            echo "::error title=Token beschädigt::CLAUDE_CODE_OAUTH_TOKEN enthält Leerzeichen oder Zeilenumbrüche. Secret neu einfügen — siehe docs/AUTOMATION.md."
            exit 1
          fi

      - uses: actions/checkout@v5
        if: env.TOKEN_DA == 'true'
        with:
          # Volle Historie, damit Claude Vorgeschichte lesen kann.
          fetch-depth: 0

      # Die Werkzeugkette kommt mit, damit Claude `just check` laufen
      # lassen kann, BEVOR es einen PR öffnet. Ohne das schriebe es blind
      # und der Fehler käme erst eine Runde später zurück — teuer, wenn
      # man am Telefon sitzt.
      # Reicht das Kontingent überhaupt? Ohne diese Frage startet unten die
      # ganze Werkzeugkette, um nach zwei Sekunden an einem 429 zu scheitern
      # — und die Action nennt den Grund nicht. Wer am Telefon sitzt, sähe
      # nur einen roten Haken.
      #
      # Die Prüfung kostet einen Aufruf ohne Modellverbrauch. Scheitert sie
      # selbst (Netz, Zeitüberschreitung), wird NICHT blockiert: Lieber ein
      # unnötiger Lauf als ein Auftrag, der wegen einer wackligen Leitung
      # liegen bleibt.
      - name: Kontingent prüfen
        if: env.TOKEN_DA == 'true'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          kopf=$(curl -s -m 20 -D- -o /dev/null https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: oauth-2025-04-20" \
            -H "content-type: application/json" \
            -d '{"model":"claude-sonnet-5","max_tokens":1,
                 "system":"You are Claude Code, Anthropic'"'"'s official CLI for Claude.",
                 "messages":[{"role":"user","content":"ok"}]}') || {
            echo "::warning title=Kontingent nicht prüfbar::Der Aufruf schlug fehl. Der Lauf geht trotzdem weiter."
            exit 0
          }

          status=$(printf '%s' "$kopf" | head -1)
          case "$status" in
            *" 429"*) ;;
            *) echo "Kontingent in Ordnung."
               printf '%s' "$kopf" | grep -iE '^anthropic-ratelimit-unified-(5h|7d)-utilization' || true
               exit 0 ;;
          esac

          # Erschöpft. Den Grund dorthin schreiben, wo gelesen wird: ins Issue.
          frei=$(printf '%s' "$kopf" | grep -i '^anthropic-ratelimit-unified-5h-reset' \
                 | tr -d '\r' | cut -d' ' -f2)
          wann="unbekannt"
          if [ -n "$frei" ]; then
            wann=$(date -u -d "@$frei" '+%d.%m. %H:%M UTC' 2>/dev/null || echo "unbekannt")
          fi

          echo "::error title=Kontingent erschöpft::Das Abo-Kontingent ist aufgebraucht. Frei ab etwa $wann."
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body \
              "⏳ **Kontingent erschöpft** — ich konnte nicht anfangen.

          Das Abo-Kontingent ist aufgebraucht. Frei wieder ab etwa **$wann**.
          Danach genügt ein neuer Kommentar mit \`@claude\`.

          *(Ein neuer Token hilft hier nicht — das Kontingent hängt am Abo, nicht am Token. Mehr in \`docs/AUTOMATION.md\`.)*" || true
          fi
          exit 1

      - name: Systembibliotheken
        if: env.TOKEN_DA == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        if: env.TOKEN_DA == 'true'
        with:
          node-version: 22
          cache: npm
      - run: rustup show
        if: env.TOKEN_DA == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.TOKEN_DA == 'true'
      - uses: taiki-e/install-action@v2
        if: env.TOKEN_DA == 'true'
        with:
          tool: just,cargo-deny
      - run: npm ci
        if: env.TOKEN_DA == 'true'

      - uses: anthropics/claude-code-action@v1
        if: env.TOKEN_DA == 'true'
        with:
          # Hängt am Abo des Inhabers. Anlegen mit `claude setup-token`,
          # dann unter Settings → Secrets and variables → Actions.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOTSCHALTER FÜR DIE FEHLERSUCHE, standardmäßig aus.
          #
          # Scheitert der Lauf mit `is_error:true` nach zwei Sekunden, nennt
          # die Action den Grund NICHT — er wird erst hiermit sichtbar
          # (anthropics/claude-code-action#1614). Zünden über die Variable
          # CLAUDE_DEBUG=true unter Settings → Secrets and variables →
          # Actions → Variables; danach wieder auf false.
          #
          # ACHTUNG in einem öffentlichen Repository: Die volle Ausgabe ist
          # dann für jeden lesbar, auch Dateiinhalte, die Claude liest.
          # Deshalb nur anlassbezogen einschalten, nicht dauerhaft.
          show_full_output: ${{ vars.CLAUDE_DEBUG == 'true' }}
          # Kein --model: Für das Umsetzen darf das stärkere Modell ran.
          # Die Festlegung auf Sonnet gilt nur den Prüf-Agents.
